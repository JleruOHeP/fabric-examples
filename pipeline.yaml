trigger: none

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Test
  displayName: Run unit tests
  jobs:
  - job: Execute
    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: 'Install .NET Runtime 8.0'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - bash: |
        pip install data-factory-testing-framework
        pip install pytest
        echo "............  installed pip stuff    ............"

        pytest tests.py
        if [ $? -ne 0 ]; then
          echo "##vso[task.logissue type=error]Failing tests!"
          exit 1 # Forces the Azure DevOps task to fail
        fi
        echo "YAY"
      displayName: 'Run tests'
    