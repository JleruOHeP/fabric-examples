trigger:
  branches:
    include:
      - main

# =========================
# VARIABLES
# =========================
variables:
  azureServiceConnection: 'fabric'
  location: 'australiaeast'
  rgName: 'rg-fabric-demo'
  fabricCapacityName: 'fabriccapacitydemo'
  fabricSkuName: 'F2'
  miName: 'fabric-demo-identity'
  adminUser: 'fabricuser@fabricguideoutlook.onmicrosoft.com'

# =========================
# STAGES
# =========================
stages:
  - stage: DeployFabricInfra
    displayName: "Deploy Microsoft Fabric Infrastructure"
    jobs:
      - job: Deploy
        displayName: "Deploy Bicep via Azure CLI"
        pool: 'Default'

        steps:
          # -------------------------
          # Checkout source
          # -------------------------
          - checkout: self
            displayName: "Checkout repository"

          # -------------------------
          # Azure Login
          # -------------------------
          - task: AzureCLI@2
            displayName: "Deploy Fabric Infrastructure"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Deploying Fabric Infrastructure..."
                az --version

                # Optional: Create RG if it doesn't exist
                az group create \
                  --name $(rgName) \
                  --location $(location)

                # Deploy the Bicep template
                az deployment group create \
                  --name fabricInfraDeploy-$(Build.BuildId) \
                  --resource-group $(rgName) \
                  --template-file ./bicep/fabric-infra.bicep \
                  --parameters \
                      location=$(location) \
                      fabricCapacityName=$(fabricCapacityName) \
                      fabricSkuName=$(fabricSkuName) \
                      adminUser=$(adminUser) \
                      miName=$(miName)

                echo "Deployment completed successfully!"